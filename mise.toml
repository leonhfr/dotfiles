[tools]
hk = "1.57.0"
gitleaks = "8.30.1"
pkl = "0.32.1"

[tasks.config]
description = "Show the current chezmoi config"
run = "bat ~/.config/chezmoi/chezmoi.toml"

[tasks.new-script]
description = "Create a new script in ~/.local/bin"
run = """
#!/bin/sh
set -eu
name="${1:?Usage: mise run new-script -- <name>}"
dir="$MISE_PROJECT_ROOT/home/dot_local/bin"
target="$dir/executable_$name"
cp "$dir/.template" "$target"
sed -i '' "s/my-script/$name/g" "$target"
echo "Created home/dot_local/bin/executable_$name → ~/.local/bin/$name"
zed "$target"
"""

[tasks.setup]
description = "Run all setup tasks"
depends = ["filevault", "firewall"]

[tasks.filevault]
description = "Enable FileVault"
run = """
fdesetup status | grep -q 'FileVault is On.' && exit 0
echo "Remember to store the recovery key in 1Password"
sudo fdesetup enable
"""

[tasks.firewall]
description = "Enable firewall"
run = """
/usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate | grep -q 'enabled' && exit 0
sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on
"""

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"
