disabledProviders:
  - claude
  - claude-plugins

defaultThinkingLevel: high

plan:
  defaultOnStartup: true

checkpoint:
  enabled: true

github:
  enabled: true

steeringMode: one-at-a-time
followUpMode: one-at-a-time

task:
  maxConcurrency: 8

memory:
  backend: local

autolearn:
  enabled: true
  autoContinue: false

secrets:
  enabled: true

tools:
  approvalMode: always-ask

bash:
  allowCompoundCommands: false
  gitGuard: true

bashInterceptor:
  enabled: true

commands:
  enableClaudeUser: false
  enableClaudeProject: false

skills:
  enableClaudeUser: false
  enableClaudeProject: false
  enableAgentsUser: true

telemetry:
  otlpExportEnabled: false

display:
  showTurnTime: true

gc:
  stale: true
  staleRetainDays: 180

symbolPreset: nerd
composer:
  shape: box
  tokenRate: false
theme:
  dark: titanium
  light: light
setupVersion: 2
